  <script>
    // 1. Check Login Session from login.html
    const sessionRaw = localStorage.getItem('activeStoreUser');
    if (!sessionRaw) window.location.href = 'login.html';
    const currentUser = JSON.parse(sessionRaw);
    document.getElementById('userGreeting').innerHTML = `👤 <strong>${currentUser.name}</strong>`;

    function logout() {
      localStorage.removeItem('activeStoreUser');
      window.location.href = 'login.html';
    }

    // 2. Store Catalog Data (Including CHMSU Car Sticker)
    let products = [
      { sku: 'PATCH-OS', name: 'CHMSU Logo Patch', size: 'One Size', price: 50, stock: 12, icon: '🛡️' },
      { sku: 'LANYARD-OS', name: 'CHMSU Lanyard', size: 'Standard', price: 80, stock: 8, icon: '🪪' },
      { sku: 'STICKER-CAR', name: 'CHMSU Car Sticker', size: 'Vehicle (4-Wheel)', price: 150, stock: 15, icon: '🚗' },
      { sku: 'STICKER-MOTO', name: 'CHMSU Car Sticker', size: 'Motorcycle', price: 100, stock: 20, icon: '🏍️' },
      { sku: 'UNIF-M-S', name: 'Prescribed Uniform (Male)', size: 'Small (S)', price: 450, stock: 3, icon: '👔' },
      { sku: 'UNIF-M-M', name: 'Prescribed Uniform (Male)', size: 'Medium (M)', price: 450, stock: 4, icon: '👔' },
      { sku: 'UNIF-M-L', name: 'Prescribed Uniform (Male)', size: 'Large (L)', price: 500, stock: 2, icon: '👔' },
      { sku: 'UNIF-M-XL', name: 'Prescribed Uniform (Male)', size: 'XL', price: 550, stock: 1, icon: '👔' },
      { sku: 'UNIF-F-S', name: 'Prescribed Uniform (Female)', size: 'Small (S)', price: 450, stock: 3, icon: '👚' },
      { sku: 'UNIF-F-M', name: 'Prescribed Uniform (Female)', size: 'Medium (M)', price: 450, stock: 4, icon: '👚' },
      { sku: 'UNIF-F-L', name: 'Prescribed Uniform (Female)', size: 'Large (L)', price: 500, stock: 2, icon: '👚' },
      { sku: 'UNIF-F-XL', name: 'Prescribed Uniform (Female)', size: 'XL', price: 550, stock: 1, icon: '👚' },
      { sku: 'NSTP-S', name: 'NSTP Shirt', size: 'Small (S)', price: 250, stock: 3, icon: '👕' },
      { sku: 'NSTP-M', name: 'NSTP Shirt', size: 'Medium (M)', price: 250, stock: 5, icon: '👕' },
      { sku: 'NSTP-L', name: 'NSTP Shirt', size: 'Large (L)', price: 250, stock: 2, icon: '👕' },
      { sku: 'NSTP-XL', name: 'NSTP Shirt', size: 'XL', price: 250, stock: 0, icon: '👕' }
    ];

    let cart = [];
    let orders = [];

    function showAlert(msg, isSuccess = false) {
      const box = document.getElementById('alertBox');
      if (!msg) return box.classList.add('hidden');
      box.textContent = msg;
      box.className = isSuccess ? 'alert success-alert' : 'alert';
    }

    function switchTab(tab) {
      showAlert(null);
      document.getElementById('tab-shop').classList.toggle('hidden', tab !== 'shop');
      document.getElementById('tab-orders').classList.toggle('hidden', tab !== 'orders');
      document.getElementById('nav-shop').classList.toggle('active', tab === 'shop');
      document.getElementById('nav-orders').classList.toggle('active', tab === 'orders');
      if (tab === 'shop') renderCatalog();
      if (tab === 'orders') renderOrders();
    }

    // 3. Render Catalog with Size / Variant Dropdowns
    function renderCatalog() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const groups = {};
      products.forEach(item => {
        if (!item.name.toLowerCase().includes(query)) return;
        if (!groups[item.name]) groups[item.name] = [];
        groups[item.name].push(item);
      });

      document.getElementById('catalogGrid').innerHTML = Object.keys(groups).map((name, idx) => {
        const variants = groups[name];
        const options = variants.map(v =>
          `<option value="${v.sku}">${v.size} — ₱${v.price} (${v.stock} left)</option>`
        ).join('');

        return `<div class="product-card">
          <div>
            <div class="product-icon">${variants.icon}</div>
            <strong style="font-size:14px; display:block; margin-bottom:6px;">${name}</strong>
            <select id="size-${idx}">${options}</select>
          </div>
          <button class="btn" onclick="addToCart('size-${idx}')">🛒 Add to Cart</button>
        </div>`;
      }).join('');
    }

    function addToCart(selectId) {
      showAlert(null);
      const sku = document.getElementById(selectId).value;
      const item = products.find(p => p.sku === sku);
      if (!item || item.stock <= 0) {
        return showAlert(`Sorry, ${item.name} (${item.size}) is currently out of stock.`);
      }
      const existing = cart.find(c => c.sku === sku);
      existing ? existing.qty++ : cart.push({ sku, qty: 1 });
      renderCart();
    }

    function updateQty(sku, delta) {
      const item = cart.find(c => c.sku === sku);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) cart = cart.filter(c => c.sku !== sku);
      renderCart();
    }

    function renderCart() {
      const list = document.getElementById('cartList');
      if (!cart.length) {
        list.innerHTML = '<p style="color:var(--text-muted); font-size:13px;">Your cart is empty.</p>';
        document.getElementById('subtotalText').textContent = '₱ 0.00';
        document.getElementById('totalText').textContent = '₱ 0.00';
        return;
      }
      let total = 0;
      list.innerHTML = cart.map(c => {
        const p = products.find(i => i.sku === c.sku);
        total += p.price * c.qty;
        return `<div class="cart-item">
          <div><strong>${p.name}</strong><br><small style="color:var(--text-muted);">${p.size} • ₱${p.price}</small></div>
          <div>
            <button class="qty-btn" onclick="updateQty('${p.sku}', -1)">-</button>
            <span style="margin:0 6px;">${c.qty}</span>
            <button class="qty-btn" onclick="updateQty('${p.sku}', 1)">+</button>
          </div>
        </div>`;
      }).join('');
      document.getElementById('subtotalText').textContent = `₱ ${total.toFixed(2)}`;
      document.getElementById('totalText').textContent = `₱ ${total.toFixed(2)}`;
    }

    // 4. Submit Order & Stock Check
    function submitOrder() {
      if (!cart.length) return showAlert('Your cart is empty. Add items before submitting.');

      const outOfStock = cart.filter(c => {
        const p = products.find(i => i.sku === c.sku);
        return !p || p.stock < c.qty;
      });

      if (outOfStock.length) {
        const names = outOfStock.map(c => {
          const p = products.find(i => i.sku === c.sku);
          return `${p.name} (${p.size})`;
        }).join(', ');
        return showAlert(`Out of stock: Not enough inventory for ${names}.`);
      }

      let total = 0;
      const summary = cart.map(c => {
        const p = products.find(i => i.sku === c.sku);
        p.stock -= c.qty;
        total += p.price * c.qty;
        return `${c.qty}x ${p.name} [${p.size}]`;
      });

      const orderId = 'CHMSU-' + Math.floor(1000 + Math.random() * 9000);
      orders.unshift({ id: orderId, items: summary.join(', '), total, status: 'Ready for Pickup' });

      cart = [];
      renderCart();
      renderCatalog();
      switchTab('orders');
      showAlert(`Order ${orderId} confirmed! Stock has been reserved for your pickup.`, true);
    }

    function renderOrders() {
      const div = document.getElementById('ordersList');
      div.innerHTML = orders.length ? orders.map(o => `
        <div style="border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <div>
            <strong>${o.id}</strong> <span class="badge ${o.status === 'Completed' ? 'badge-green' : 'badge-gold'}">${o.status}</span><br>
            <small style="color:var(--text-muted);">${o.items} • <strong>₱${o.total.toFixed(2)}</strong></small>
          </div>
          ${o.status === 'Ready for Pickup'
            ? `<button class="btn btn-sm" onclick="claimAndPay('${o.id}')">Claim and Pay (₱${o.total.toFixed(2)})</button>`
            : `<span style="font-size:12px; color:var(--chmsu-green); font-weight:700;">✓ Paid & Claimed</span>`}
        </div>
      `).join('') : '<p style="color:var(--text-muted); font-size:13px;">You have not placed any orders yet.</p>';
    }

    function claimAndPay(orderId) {
      const order = orders.find(o => o.id === orderId);
      if (order) order.status = 'Completed';
      renderOrders();
      showAlert(`Payment received for ${orderId}. Thank you for shopping at the CHMSU Online Store!`, true);
    }

    renderCatalog();
  </script>
</body>
</html>
